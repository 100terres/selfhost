# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

services:
  dagu:
    image: ghcr.io/dagucloud/dagu:2.7.11
    container_name: dagu
    restart: always
    networks:
      - default
      - core-registry
      - gateway-dagu-resource
    healthcheck:
      test:
        [
          "CMD",
          "perl",
          "-MIO::Socket::INET",
          "-e",
          'my $$s = IO::Socket::INET->new("localhost:8080") or exit 1; print $$s "GET /api/v1/health HTTP/1.0\r\n\r\n"; exit((join "", <$$s>) =~ /healthy/ ? 0 : 1)',
        ]
    links:
      - dagu-docker-in-docker
    depends_on:
      dagu-docker-in-docker:
        condition: service_started
    expose:
      - "8080"
    volumes:
      - dagu-data:/var/lib/dagu
      - ./dags:/var/lib/dagu/dags
    environment:
      - DOCKER_HOST=tcp://dagu-docker-in-docker:2375
      - DAGU_HOME=/var/lib/dagu
      - DAGU_DAGS_DIR=/var/lib/dagu/dags
      - DAGU_AUTH_MODE=builtin
      - DAGU_TZ=Etc/UTC

  dagu-docker-in-docker:
    image: docker:dind
    container_name: "dagu-docker-in-docker"
    restart: "unless-stopped"
    privileged: "true"
    volumes:
      - /var/lib/selfhost-ipc-worker:/var/lib/selfhost-ipc-worker
    command:
      [
        "dockerd",
        "-H",
        "tcp://0.0.0.0:2375",
        "--tls=0",
        "--insecure-registry",
        "core.registry:5000",
      ]
    networks:
      - core-registry
      - forgejo

networks:
  default:
    name: intranet
    external: true
  core-registry:
    name: core-registry
    external: true
  forgejo:
    name: forgejo
    external: true
  gateway-dagu-resource:
    name: gateway-dagu-resource
    external: true

volumes:
  dagu-data:
    driver: local
